name: CI
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e '.[dev]'
      - run: pytest -q
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run lint
      - run: npm run build
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start complete local stack
        run: docker compose up --build -d
      - name: Smoke-test API and frontend
        shell: bash
        run: |
          set -euo pipefail
          wait_for_url() {
            local url="$1"
            local output="$2"
            for attempt in $(seq 1 45); do
              if curl --fail --silent --show-error "$url" >"$output" 2>/dev/null; then
                return 0
              fi
              sleep 2
            done
            echo "Timed out waiting for $url" >&2
            return 1
          }
          wait_for_url http://localhost:8000/health /tmp/health.json
          python -c "import json; d=json.load(open('/tmp/health.json')); assert d['status']=='ok' and d['asr']=='not-configured', d"
          wait_for_url http://localhost:3000/ /tmp/home.html
          python -c "from pathlib import Path; h=Path('/tmp/home.html').read_text().lower(); assert 'dictation' in h and 'flow' in h, h[:1000]"
          wait_for_url http://localhost:3000/api/health /tmp/web-health.json
          python -c "import json; d=json.load(open('/tmp/web-health.json')); assert d['status']=='ok', d"
          curl --fail --silent --show-error -X POST http://localhost:3000/api/v1/format -H 'Content-Type: application/json' -d '{"transcript":"hello world","style":"natural"}' > /tmp/web-format.json
          python -c "import json; d=json.load(open('/tmp/web-format.json')); assert d['text']=='hello world.' and d['review_required'] is True, d"
          curl --fail --silent --show-error -X POST http://localhost:8000/v1/format -H 'Content-Type: application/json' -d '{"transcript":"hello world","style":"natural"}' > /tmp/api-format.json
          python -c "import json; d=json.load(open('/tmp/api-format.json')); assert d['text']=='hello world.' and d['review_required'] is True, d"
          code=$(curl --silent --show-error --output /tmp/asr.json --write-out '%{http_code}' -X POST http://localhost:8000/v1/transcriptions)
          test "$code" = "501"
          code=$(curl --silent --show-error --output /tmp/sessions.json --write-out '%{http_code}' http://localhost:3000/api/v1/sessions)
          test "$code" = "401" -o "$code" = "503"
      - name: Print container logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop stack
        if: always()
        run: docker compose down -v
